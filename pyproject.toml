[project]
name = "agent-evals"
version = "0.1.0"
description = "Run and grade LLM solvers against containerized SWE-bench-style coding tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
# LLM providers are opt-in: install only the SDK for the one you use.
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.5"]
# `evals scaffold --instance-id` streams a row straight from a HuggingFace dataset.
# Not needed for init/validate/run/grade, or for scaffold --row with an already-saved file.
scaffold = ["datasets>=2.19"]
all = ["boto3>=1.34", "anthropic>=0.40", "openai>=1.40", "google-genai>=0.5", "datasets>=2.19"]

[project.scripts]
evals = "agent_evals.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_evals*"]
